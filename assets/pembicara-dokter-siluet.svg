<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051633" />
      <stop offset="50%" stop-color="#0a2656" />
      <stop offset="100%" stop-color="#071b3e" />
    </linearGradient>

    <!-- Radial Glow Behind Head -->
    <radialGradient id="headGlow" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#ffbd19" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#ffbd19" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0a2656" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Blue Glow -->
    <radialGradient id="blueGlow" cx="50%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#051633" stop-opacity="0" />
    </radialGradient>

    <!-- Silhouette Gradient -->
    <linearGradient id="silGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e2a54" />
      <stop offset="50%" stop-color="#081c3c" />
      <stop offset="100%" stop-color="#041228" />
    </linearGradient>

    <!-- Gold Rim Light Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082" />
      <stop offset="50%" stop-color="#ffbd19" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Stethoscope Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="20" fill="url(#bgGrad)" />

  <!-- Geometric Grid Accent in Background -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="500" />
    <line x1="150" y1="0" x2="150" y2="500" />
    <line x1="250" y1="0" x2="250" y2="500" />
    <line x1="350" y1="0" x2="350" y2="500" />
    <line x1="450" y1="0" x2="450" y2="500" />
    <line x1="0" y1="100" x2="500" y2="100" />
    <line x1="0" y1="200" x2="500" y2="200" />
    <line x1="0" y1="300" x2="500" y2="300" />
    <line x1="0" y1="400" x2="500" y2="400" />
  </g>

  <!-- Aura Glows -->
  <circle cx="250" cy="210" r="180" fill="url(#headGlow)" />
  <circle cx="250" cy="420" r="200" fill="url(#blueGlow)" />

  <!-- Doctor Silhouette Silhouette Group -->
  <g id="doctor-silhouette">
    <!-- Body / Shoulders & Lab Coat -->
    <path d="M90 500 C90 410, 135 340, 190 325 L215 320 L215 285 C222 290, 235 295, 250 295 C265 295, 278 290, 285 285 L285 320 L310 325 C365 340, 410 410, 410 500 Z"
          fill="url(#silGrad)"
          stroke="url(#goldRim)"
          stroke-width="2.5"
          stroke-opacity="0.6" />

    <!-- Lab Coat V-Collar Details -->
    <path d="M190 325 L225 380 L235 340 L215 320 Z" fill="#0c234b" stroke="url(#goldRim)" stroke-width="1.2" stroke-opacity="0.4" />
    <path d="M310 325 L275 380 L265 340 L285 320 Z" fill="#0c234b" stroke="url(#goldRim)" stroke-width="1.2" stroke-opacity="0.4" />

    <!-- Tie & Shirt Inner -->
    <path d="M235 340 L250 365 L265 340 L257 320 L243 320 Z" fill="#143468" />
    <path d="M245 365 L255 365 L253 430 L250 445 L247 430 Z" fill="#091b38" stroke="url(#goldRim)" stroke-width="1" stroke-opacity="0.3" />

    <!-- Head & Hair Silhouette -->
    <!-- Head Base Oval -->
    <ellipse cx="250" cy="205" rx="62" ry="76"
             fill="url(#silGrad)"
             stroke="url(#goldRim)"
             stroke-width="2.5"
             stroke-opacity="0.75" />

    <!-- Sleek Hair Cut Shape -->
    <path d="M188 200 C185 145, 210 120, 250 120 C290 120, 315 145, 312 200 C306 175, 292 145, 250 145 C208 145, 194 175, 188 200 Z"
          fill="#061630"
          stroke="url(#goldRim)"
          stroke-width="1.5"
          stroke-opacity="0.8" />

    <!-- Ears -->
    <path d="M188 195 C182 195, 180 215, 188 220 Z" fill="#0a224a" stroke="url(#goldRim)" stroke-width="1.5" stroke-opacity="0.6" />
    <path d="M312 195 C318 195, 320 215, 312 220 Z" fill="#0a224a" stroke="url(#goldRim)" stroke-width="1.5" stroke-opacity="0.6" />

    <!-- Stethoscope Around Neck (Detailed Medical Indicator) -->
    <!-- Left Tube -->
    <path d="M220 295 C205 320, 195 370, 210 410 C220 435, 238 450, 250 450"
          fill="none"
          stroke="#ffbd19"
          stroke-width="4.5"
          stroke-linecap="round"
          filter="url(#softGlow)" />
    <!-- Right Tube -->
    <path d="M280 295 C295 320, 305 370, 290 410 C280 435, 262 450, 250 450"
          fill="none"
          stroke="#ffbd19"
          stroke-width="4.5"
          stroke-linecap="round"
          filter="url(#softGlow)" />
    <!-- Chest Piece (Disc) -->
    <circle cx="250" cy="454" r="14" fill="#081f44" stroke="#ffbd19" stroke-width="3" filter="url(#softGlow)" />
    <circle cx="250" cy="454" r="7" fill="#ffbd19" />
  </g>

  <!-- Medical Cross / Caduceus Mini Watermark Glow -->
  <g opacity="0.12" fill="#38bdf8" transform="translate(250, 80) scale(0.6)">
    <path d="M-20 -50 H20 V-20 H50 V20 H20 V50 H-20 V20 H-50 V-20 H-20 Z" />
  </g>

  <!-- Luxury Exclusive Badge at Bottom -->
  <g transform="translate(110, 428)">
    <!-- Badge Pill Base -->
    <rect width="280" height="48" rx="24" fill="#061b3d" stroke="#ffbd19" stroke-width="1.8" filter="url(#softGlow)" />
    <!-- Lock / Sparkle Icon -->
    <g transform="translate(26, 15) scale(0.75)">
      <path d="M12 2a4 4 0 0 0-4 4v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-2V6a4 4 0 0 0-4-4zm-2 7V6a2 2 0 1 1 4 0v3h-4z" fill="#ffbd19"/>
    </g>
    <!-- Badge Text -->
    <text x="156" y="24" fill="#ffbd19" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="900" letter-spacing="1.5" text-anchor="middle">EXCLUSIVE GUEST</text>
    <text x="156" y="38" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.8" text-anchor="middle">DOKTER SPESIALIS KEDINASAN</text>
  </g>

  <!-- Outer Border Frame -->
  <rect x="2" y="2" width="496" height="496" rx="18" fill="none" stroke="rgba(255, 189, 25, 0.35)" stroke-width="2" />
</svg>